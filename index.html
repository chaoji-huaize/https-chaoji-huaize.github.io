<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CNC进给转速速查</title>
<meta name="theme-color" content="#2196F3">
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;margin:0;padding:0;}
body{background:#1a1a1a;color:#eee;padding:16px;max-width:480px;margin:0 auto;}
.card{background:#2b2b2b;border-radius:12px;padding:16px;margin-bottom:14px;}
h2{font-size:18px;margin-bottom:12px;color:#42a5f5;}
label{display:block;margin:10px 0 4px;font-size:14px;color:#ccc;}
select,input{width:100%;padding:10px;border-radius:8px;border:none;font-size:16px;background:#3c3c3c;color:#fff;}
.result{margin-top:12px;padding:12px;background:#113322;border-radius:8px;color:#89ff94;font-size:16px;line-height:1.7;}
button{width:100%;padding:12px;background:#2196F3;color:white;border:none;border-radius:8px;margin-top:10px;font-size:16px;}
.btn-copy{background:#27ae60;margin-top:8px;}
.tip{font-size:12px;color:#aaa;margin-top:8px;line-height:1.6;}
.row{display:flex;gap:10px;}
.row>div{flex:1;}
.hidden{display:none;}
</style>
</head>
<body>
<div class="card">
<h2>📌 数控刀具参数选择</h2>
<label>切削档位</label>
<select id="level">
<option value="cons">保守（稳，防崩刀 / 振刀）</option>
<option value="mid" selected>适中（常规加工）</option>
<option value="high">偏高（效率优先，刚性要好）</option>
</select>
<label>刀具类型</label>
<select id="toolType" onchange="onTypeChange()">
<option value="endmill">立铣刀（按每齿进给 fz）</option>
<option value="drill">钻头（按每转进给 f）</option>
</select>
<label>材料</label>
<select id="mat">
<option value="45#">45钢 HB170~220</option>
<option value="Q235">Q235 碳钢 HB140~180</option>
<option value="40Cr">40Cr 调质</option>
<option value="06Cr19Ni10">06Cr19Ni10（304不锈钢）</option>
<option value="HT200">铸铁 HT200</option>
<option value="6061">6061 铝</option>
<option value="HRC32">预硬钢 HRC30~35</option>
<option value="HRC60">淬硬钢 HRC58~62</option>
<option value="TC4">TC4 钛合金</option>
<option value="PA66">PA6/PA66 尼龙</option>
</select>
<label>刀具材质</label>
<select id="tool">
<option value="hard">硬质合金</option>
<option value="hss">高速钢</option>
</select>
<div class="row">
<div>
<label>刀具直径 D (mm)</label>
<input type="number" id="D" value="10" step="0.1">
</div>
<div id="zCol">
<label>刃数 z</label>
<input type="number" id="z" value="4" step="1">
</div>
</div>
<label>计算方式</label>
<select id="calcMode" onchange="onModeChange()">
<option value="vc">按推荐线速度 Vc 算转速</option>
<option value="n">按自定义转速 S 算进给</option>
</select>
<div id="customNRow" class="hidden">
<label>自定义转速 S (rpm)</label>
<input type="number" id="customN" value="3000" step="10">
</div>
<label>进给模式</label>
<select id="feedMode">
<option value="g94">G94  mm/min</option>
<option value="g95">G95  mm/r</option>
</select>
<button id="calcBtn" onclick="calc()">计算转速进给</button>
<button class="btn-copy" onclick="copyRes()">复制结果</button>
</div>
<div class="card">
<h2>📊 计算结果</h2>
<div class="result" id="res">等待计算</div>
<div class="tip" id="tip">铣刀：n = 1000·Vc /（π·D），Vf = n × z × fz。新参数先按计算值 70% 试切，稳定后再往上加。</div>
</div>

<script>
// ===== 立铣刀基准参数（适中档，vc m/min / fz mm/z） =====
const mill = {
"45#":{ hard:{vc:100,fz:0.12}, hss:{vc:25,fz:0.08} },
"Q235":{ hard:{vc:110,fz:0.14}, hss:{vc:28,fz:0.08} },
"40Cr":{ hard:{vc:75,fz:0.10}, hss:{vc:18,fz:0.06} },
"304":{ hard:{vc:50,fz:0.08}, hss:{vc:12,fz:0.05} },
"06Cr19Ni10":{ hard:{vc:70,fz:0.08}, hss:{vc:15,fz:0.05} },
"HT200":{ hard:{vc:75,fz:0.15}, hss:{vc:20,fz:0.10} },
"6061":{ hard:{vc:320,fz:0.20}, hss:{vc:80,fz:0.12} },
"HRC32":{ hard:{vc:40,fz:0.06}, hss:{vc:10,fz:0.04} },
"HRC60":{ hard:{vc:22,fz:0.03}, hss:{vc:5,fz:0.02} },
"TC4":{ hard:{vc:35,fz:0.06}, hss:{vc:9,fz:0.04} },
"PA66":{ hard:{vc:350,fz:0.12}, hss:{vc:120,fz:0.08} }
};

// ===== 钻头基准参数（适中档，vc m/min / f mm/r） =====
const drill = {
"45#":{ hard:{vc:70,f:0.18}, hss:{vc:20,f:0.14} },
"Q235":{ hard:{vc:80,f:0.20}, hss:{vc:22,f:0.16} },
"40Cr":{ hard:{vc:55,f:0.14}, hss:{vc:15,f:0.11} },
"304":{ hard:{vc:25,f:0.10}, hss:{vc:8,f:0.07} },
"06Cr19Ni10":{ hard:{vc:28,f:0.11}, hss:{vc:10,f:0.07} },
"HT200":{ hard:{vc:75,f:0.22}, hss:{vc:18,f:0.18} },
"6061":{ hard:{vc:180,f:0.30}, hss:{vc:40,f:0.22} },
"HRC32":{ hard:{vc:40,f:0.12}, hss:{vc:8,f:0.08} },
"HRC60":{ hard:{vc:15,f:0.06}, hss:{vc:4,f:0.04} },
"TC4":{ hard:{vc:20,f:0.08}, hss:{vc:6,f:0.05} },
"PA66":{ hard:{vc:180,f:0.15}, hss:{vc:70,f:0.10} }
};

// 档位倍率：保守 / 适中 / 偏高
const levelMult = {
    cons: { vc: 0.85, f: 0.75, name: "保守" },
    mid:  { vc: 1.00, f: 1.00, name: "适中" },
    high: { vc: 1.15, f: 1.25, name: "偏高" }
};

// 风险提示：易粘屑 / 崩尖材料
const riskMap = {
    "304": "⚠️ 易粘刀、加工硬化明显，易出积屑瘤、崩尖；务必充足冷却，先试切！",
    "06Cr19Ni10": "⚠️ 易粘刀、加工硬化明显，易出积屑瘤、崩尖；务必充足冷却，先试切！",
    "TC4": "⚠️ 钛合金导热差、易粘刀，需高压冷却，进给不宜过小，先试切！",
    "PA66": "⚠️ 尼龙受热易熔化粘刀、吸水易变形，优先风冷，避免大量水冷；刃口必须锋利，建议试切！"
};

let resultText = "";

function onTypeChange(){
    const t = document.getElementById("toolType").value;
    document.getElementById("zCol").classList.toggle("hidden", t === "drill");
    document.getElementById("tip").textContent = t === "drill"
        ? "钻头：n = 1000·Vc /（π·D），进给 F = n × f（每转进给）。深孔注意啄钻排屑。"
        : "铣刀：n = 1000·Vc /（π·D），Vf = n × z × fz。新参数先按计算值 70% 试切，稳定后再往上加。";
}

function onModeChange(){
    const m = document.getElementById("calcMode").value;
    document.getElementById("customNRow").classList.toggle("hidden", m !== "n");
}

function calc(){
    const type = document.getElementById("toolType").value;
    const mat = document.getElementById("mat").value;
    const tool = document.getElementById("tool").value;
    const level = document.getElementById("level").value;
    const D = Number(document.getElementById("D").value);
    const feedMode = document.getElementById("feedMode").value;
    const calcMode = document.getElementById("calcMode").value;
    if(!D){ alert("请填好刀具直径"); return; }

    const table = type === "drill" ? drill : mill;
    const base = table[mat][tool];
    const mult = levelMult[level];

    let n, Vc, vcNote = "";
    if(calcMode === "n"){
        n = Number(document.getElementById("customN").value);
        if(!n){ alert("请填自定义转速 S"); return; }
        Vc = Math.PI * D * n / 1000;
        vcNote = "（按自定义转速反算）";
    }else{
        Vc = base.vc * mult.vc;
        n = (1000 * Vc) / (Math.PI * D);
    }

    let feedStr = "", otherLines = "";

    if(type === "drill"){
        const f = base.f * mult.f;
        const Vf = n * f;
        feedStr = feedMode === "g94"
            ? `进给 F(G94)：${Vf.toFixed(0)} mm/min`
            : `进给 F(G95)：${f.toFixed(3)} mm/r`;
        otherLines = `每转进给 f：${f.toFixed(3)} mm/r`;
        resultText = `切削档位：${mult.name}
转速 S：${n.toFixed(0)} rpm
${feedStr}
切削速度 Vc：${Vc.toFixed(1)} m/min${vcNote}
${otherLines}
建议试切先用 70% 参数，稳定再往上加`;
    }else{
        const z = Number(document.getElementById("z").value);
        if(!z){ alert("请填好刃数 z"); return; }
        const fz = base.fz * mult.f;
        const Vf = n * z * fz;
        feedStr = feedMode === "g94"
            ? `进给 F(G94)：${Vf.toFixed(0)} mm/min`
            : `进给 F(G95)：${(z*fz).toFixed(3)} mm/r`;
        otherLines = `每齿进给 fz：${fz.toFixed(3)} mm/z`;
        resultText = `切削档位：${mult.name}
转速 S：${n.toFixed(0)} rpm
${feedStr}
切削速度 Vc：${Vc.toFixed(1)} m/min${vcNote}
${otherLines}
建议试切先用 70% 参数，稳定再往上加`;
    }
    const warn = riskMap[mat];
    if(warn) resultText += "\n" + warn;
    document.getElementById("res").innerHTML = resultText.replaceAll("\n","<br>");
}

function copyRes(){
    if(!resultText){ alert("先计算！"); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(resultText).then(()=>alert("✅ 已复制"));
    }else{
        const t=document.createElement("textarea"); t.value=resultText; document.body.appendChild(t);
        t.select(); document.execCommand("copy"); document.body.removeChild(t); alert("✅ 已复制");
    }
}

// 仅页面初始化界面状态，不自动计算；结果须点击按钮后生成
onTypeChange();
onModeChange();
</script>
</body>
</html>
