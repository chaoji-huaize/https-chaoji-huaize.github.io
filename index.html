<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC切削转速进给计算器</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#111;color:#eee;padding:16px;max-width:720px;margin:0 auto}
.box{background:#222;padding:16px;border-radius:12px;margin-bottom:12px}
.row{margin:10px 0}
label{display:block;margin-bottom:4px;color:#ccc}
select,input{width:100%;padding:10px;font-size:16px;background:#333;color:#fff;border:1px solid #444;border-radius:6px}
.result{background:#0b331a;padding:16px;border-radius:10px;color:#7cf;font-size:18px;line-height:1.7}
.tip{color:#999;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<h2>CNC切削转速进给计算器</h2>
<div class="box">
  <div class="row">
    <label>刀具类型</label>
    <select id="toolType">
      <option value="mill">立铣刀</option>
      <option value="drill">钻头</option>
    </select>
  </div>
  <div class="row">
    <label>材料</label>
    <select id="mat">
      <option>45钢 HB170~220</option>
      <option>Q235碳钢 HB140~180</option>
      <option>40Cr调质</option>
      <option>304不锈钢</option>
      <option>铸铁HT200</option>
      <option>6061铝</option>
      <option>预硬钢 HRC30~35</option>
      <option>淬硬钢 HRC58~62</option>
      <option>TC4钛合金</option>
    </select>
  </div>
  <div class="row">
    <label>刀具直径 D (mm)</label>
    <input type="number" id="D" value="6" step="0.1">
  </div>
  <div class="row" id="zRow">
    <label>刃数 z</label>
    <input type="number" id="z" value="2">
  </div>
  <div class="row">
    <label>刀具材质</label>
    <select id="toolMat">
      <option>硬质合金</option>
      <option>高速钢</option>
    </select>
  </div>
  <div class="row">
    <label>进给模式</label>
    <select id="feedMode">
      <option value="G94">G94 mm/min</option>
      <option value="G95">G95 mm/r</option>
    </select>
  </div>
</div>

<div class="box result" id="res">
<div>转速 S: -- rpm</div>
<div>进给 F: -- </div>
<div>切削速度 Vc: -- m/min</div>
<div id="fzLine">每齿进给 fz: -- mm/z</div>
<div id="fLine" style="display:none">每转进给 f: -- mm/r</div>
<div style="margin-top:8px;color:#8f8">建议试切先用 70% 参数，稳定再往上加</div>
</div>
<div class="tip" id="formulaTip"></div>

<script>
const param = {
  "45钢 HB170~220":{
    mill:{carb:{vc:100,fz:0.12},hss:{vc:25,fz:0.06}},
    drill:{carb:{vc:70,f:0.18},hss:{vc:22,f:0.10}}
  },
  "Q235碳钢 HB140~180":{
    mill:{carb:{vc:110,fz:0.14},hss:{vc:28,fz:0.08}},
    drill:{carb:{vc:80,f:0.20},hss:{vc:25,f:0.12}}
  },
  "40Cr调质":{
    mill:{carb:{vc:70,fz:0.10},hss:{vc:18,fz:0.05}},
    drill:{carb:{vc:55,f:0.14},hss:{vc:16,f:0.08}}
  },
  "304不锈钢":{
    mill:{carb:{vc:60,fz:0.08},hss:{vc:16,fz:0.04}},
    drill:{carb:{vc:25,f:0.10},hss:{vc:10,f:0.05}}
  },
  "铸铁HT200":{
    mill:{carb:{vc:120,fz:0.16},hss:{vc:30,fz:0.09}},
    drill:{carb:{vc:75,f:0.24},hss:{vc:26,f:0.14}}
  },
  "6061铝":{
    mill:{carb:{vc:300,fz:0.20},hss:{vc:80,fz:0.12}},
    drill:{carb:{vc:180,f:0.30},hss:{vc:60,f:0.18}}
  },
  "预硬钢 HRC30~35":{
    mill:{carb:{vc:60,fz:0.08},hss:{vc:14,fz:0.04}},
    drill:{carb:{vc:45,f:0.12},hss:{vc:12,f:0.06}}
  },
  "淬硬钢 HRC58~62":{
    mill:{carb:{vc:30,fz:0.04},hss:{vc:8,fz:0.02}},
    drill:{carb:{vc:18,f:0.06},hss:{vc:5,f:0.03}}
  },
  "TC4钛合金":{
    mill:{carb:{vc:40,fz:0.07},hss:{vc:12,fz:0.04}},
    drill:{carb:{vc:20,f:0.08},hss:{vc:8,f:0.04}}
  }
};

const $ = s=>document.querySelector(s);
const $$ = s=>document.querySelectorAll(s);

function calc(){
  const toolType = $("#toolType").value;
  const matKey = $("#mat").value;
  const toolMat = $("#toolMat").value === "硬质合金" ? "carb" : "hss";
  const feedMode = $("#feedMode").value;
  const D = Number($("#D").value);
  const z = Number($("#z").value);
  const p = param[matKey][toolType][toolMat];
  const vc = p.vc;
  const n = 1000 * vc / (Math.PI * D);

  let fG95, fG94, fz, f;
  if(toolType === "mill"){
    fz = p.fz;
    fG95 = fz;
    fG94 = n * z * fz;
    $("#fzLine").style.display="block";
    $("#fLine").style.display="none";
    $("#formulaTip").textContent=`立铣刀：n = 1000·Vc/(π·D)，F = n × z × fz`;
  }else{
    f = p.f;
    fG95 = f;
    fG94 = n * f;
    $("#fzLine").style.display="none";
    $("#fLine").style.display="block";
    $("#formulaTip").textContent=`钻头：n = 1000·Vc/(π·D)，F = n × f（每转进给）。深孔注意啄钻排屑`;
  }

  let feedText = "";
  if(feedMode === "G94"){
    feedText = `${fG94.toFixed(0)} mm/min (G94)`;
  }else{
    feedText = `${fG95.toFixed(3)} mm/r (G95)`;
  }

  $("#res").innerHTML = `
<div>转速 S: ${n.toFixed(0)} rpm</div>
<div>进给 F: ${feedText}</div>
<div>切削速度 Vc: ${vc} m/min</div>
<div id="fzLine">每齿进给 fz: ${fz?fz.toFixed(3):''} mm/z</div>
<div id="fLine">每转进给 f: ${f?f.toFixed(3):''} mm/r</div>
<div style="margin-top:8px;color:#8f8">建议试切先用 70% 参数，稳定再往上加</div>
`;
}

$("#toolType").onchange = function(){
  $("#zRow").style.display = this.value==="mill"?"block":"none";
  calc();
};
$$("select,input").forEach(el=>el.oninput=calc);
calc();
</script>
</body>
</html>
